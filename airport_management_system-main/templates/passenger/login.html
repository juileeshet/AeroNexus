{% extends "base.html" %}

{% block title %}Passenger Login{% endblock %}

{% block content %}
<div class="form-container">
    <div class="auth-form">
        <div class="auth-icon"><i class="bi bi-person-circle"></i></div>
        <h2 class="text-center mb-1">Passenger Login</h2>
        <p class="text-center text-secondary mb-4">Sign in to manage your bookings.</p>
        {% if error_message %}
        <div class="alert alert-danger">{{ error_message }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('login') }}" onsubmit="return validateForm('login-form')" id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
        <div class="text-center mt-3">
            <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
